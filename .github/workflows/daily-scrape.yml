name: Daily TN Press Release Scrape

on:
  schedule:
    # 6:00 PM IST = 12:30 PM UTC — catches all press releases published during the day
    - cron: "30 12 * * *"
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab
    inputs:
      date:
        description: "Date to scrape (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraping/requirements.txt

      - name: Install dependencies
        run: pip install -r scraping/requirements.txt

      - name: Run pipeline
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scraping/daily_pipeline.py --date "${{ github.event.inputs.date }}"
          else
            python scraping/daily_pipeline.py
          fi
